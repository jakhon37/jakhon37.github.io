<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      @font-face {
        font-family: "Source Serif 4 Variable";
        font-style: normal;
        font-display: block;
        font-weight: 200 900;
        src: url("../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2")
          format("woff2-variations");
      }
      @font-face {
        font-family: "Source Sans 3 Variable";
        font-style: normal;
        font-display: block;
        font-weight: 200 900;
        src: url("../node_modules/@fontsource-variable/source-sans-3/files/source-sans-3-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #faf8f5;
        color: #1a1917;
      }

      .card {
        width: 1200px;
        height: 630px;
        padding: 58px 68px 46px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 400px;
        grid-template-rows: 1fr auto;
        column-gap: 28px;
        background: #faf8f5;
      }

      .copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        padding-bottom: 8px;
      }

      .name {
        font-family: "Source Serif 4 Variable", Georgia, "Iowan Old Style", serif;
        font-size: 62px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.02;
      }

      .role {
        margin-top: 14px;
        font-family: "Source Sans 3 Variable", "Helvetica Neue", Helvetica, sans-serif;
        font-size: 23px;
        font-weight: 400;
        letter-spacing: 0.015em;
        color: #5c574f;
      }

      .statement {
        margin-top: 28px;
        font-family: "Source Serif 4 Variable", Georgia, "Iowan Old Style", serif;
        font-size: 29px;
        font-weight: 500;
        letter-spacing: -0.022em;
        line-height: 1.3;
        max-width: 24ch;
      }

      .portrait-wrap {
        align-self: center;
        justify-self: end;
        width: 400px;
        height: 430px;
        margin-bottom: 6px;
      }

      .portrait {
        width: 400px;
        height: 430px;
        object-fit: cover;
        object-position: center 18%;
        -webkit-mask-image: radial-gradient(
          ellipse 78% 82% at 50% 38%,
          #000 46%,
          transparent 78%
        );
        mask-image: radial-gradient(
          ellipse 78% 82% at 50% 38%,
          #000 46%,
          transparent 78%
        );
      }

      .foot {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-top: 20px;
        border-top: 1px solid #e4ddd4;
        font-family: "Source Sans 3 Variable", "Helvetica Neue", Helvetica, sans-serif;
        font-size: 20px;
        color: #5c574f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="copy">
        <h1 class="name">Jakhongir Nodirov</h1>
        <p class="role">AI Research Engineer · Robotics · Computer Vision</p>
        <p class="statement">
          Perception and autonomy — robots, inspection systems, and models that
          have to run on the machine.
        </p>
      </div>
      <div class="portrait-wrap">
        <img class="portrait" src="../public/portrait.png" alt="" />
      </div>
      <div class="foot">
        <span>HyVision System · Seongnam</span>
        <span>jakhon37.github.io</span>
      </div>
    </div>
  </body>
</html>
