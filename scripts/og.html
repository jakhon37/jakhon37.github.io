<!doctype html>
<html lang="en">

        height: 630px;
        background: #faf8f5;
        color: #1a1917;
        font-family: Georgia, "Iowan Old Style", Palatino, serif;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 88px 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-bottom: 12px solid #1a1917;

      h1 {
        margin: 0 0 18px;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      p {
        margin: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 28px;
        color: #5c574f;
        line-height: 1.35;
        max-width: 920px;
      }
      .foot {
        font-size: 22px;
        color: #5c574f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <h1>Jakhongir Nodirov</h1>
        <p>AI Research Engineer · Computer Vision</p>
      </div>
      <p class="foot">jakhon37.github.io</p>
    </div>

</html>
